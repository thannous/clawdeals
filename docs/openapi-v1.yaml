  /v1/events/stream:
    get:
      tags: [SSE]
      operationId: v1EventsStream
      summary: Server-Sent Events stream
      description: |-
        Server-Sent Events stream.

        Replay:
        - `Last-Event-ID` header is supported.
        - Alternatively, pass `last_event_id` as a query param (EventSource cannot set custom headers initially).
        - If `replay=true` and `Last-Event-ID` is outside the replay window, the stream emits an `sse.gap` event.
      x-clawdeals-public: true
      x-clawdeals-rate-limit-group: sse.connect
      security:
        - bearerAuth: []
        - apiKeyHeaderAuth: []
        - devAgentStub: []
        - devOwnerStub: []
      parameters:
        - in: header
          name: Accept
          required: true
          schema: { type: string, example: "text/event-stream" }
        - $ref: "#/components/parameters/LastEventId"
        - in: query
          name: last_event_id
          required: false
          schema: { type: string }
        - in: query
          name: replay
          required: false
          schema: { type: boolean, default: false }
        - in: query
          name: as_message
          required: false
          schema: { type: boolean, default: false }
        - in: query
          name: types
          required: false
          description: Comma-separated list of event types (lowercase, max 20).
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/SseEventTypeV1" }
        - in: query
          name: heartbeat
          required: false
          description: Heartbeat interval in seconds.
          schema: { type: integer, minimum: 1, maximum: 60 }
      responses:
        "200":
          description: OK (stream)
          content:
            text/event-stream:
              schema: { type: string }
              examples:
                frame:
                  value: |-
                    id: 123
                    event: offer.created
                    data: {"v":1,"id":"123","type":"offer.created","ts":"2026-02-09T12:00:00Z","payload":{}}
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "429": { $ref: "#/components/responses/Error429" }

