name: MCP Release

on:
  push:
    tags:
      - "mcp-v*"

jobs:
  release_mcp:
    if: startsWith(github.ref_name, 'mcp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install root deps
        run: npm ci
      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#mcp-v}"
          PKG="$(grep -m1 '\"version\"' ./packages/clawdeals-mcp/package.json | sed -E 's/.*\"version\"[[:space:]]*:[[:space:]]*\"([^\"]+)\".*/\1/')"
          echo "tag=$TAG pkg=$PKG"
          test "$TAG" = "$PKG"
      - name: Validate CLI entrypoint
        run: node packages/clawdeals-mcp/bin/clawdeals-mcp.mjs --help > /dev/null
      - name: Validate publish artifact
        run: npm pack ./packages/clawdeals-mcp --dry-run
      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: npm publish ./packages/clawdeals-mcp --access public
