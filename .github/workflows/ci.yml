name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Restore ESLint cache
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: ${{ runner.os }}-node-24-eslint-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node-24-eslint-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint -- --cache --cache-location .eslintcache --cache-strategy content

  contracts:
    name: Typecheck and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate i18n page contract
        run: npm run test:i18n:contract
      - name: Validate i18n messages
        run: npm run test:i18n:messages
      - name: Lint OpenAPI contract
        run: npm run openapi:lint
      - name: Validate skill pack
        run: npm run test:skill:pack
      - name: Validate public skill files
        run: npm run test:skill:public

  unit_tests:
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit-test shard
        run: npm run test:unit -- --shard=${{ matrix.shard }}/2

  worker_contracts:
    name: Cloudflare Worker contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run edge and remote MCP contracts
        run: npm run test:unit -- src/__tests__/mcp/http-worker.test.ts src/__tests__/worker.edge-router.test.ts
      - name: Bundle Worker without deploying
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm exec -- wrangler deploy --dry-run --outdir "$RUNNER_TEMP/clawdeals-worker-bundle"

  testerarmy:
    name: TesterArmy browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TESTERARMY_AI: "0"
      E2E_CI_ROOT: .e2e/ci/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Check evidence preservation and bounded archive controls
        run: node --test e2e/testerarmy/evidence.test.mjs
      - name: Run public and historical journeys with time for evidence
        # Keep the existing 15-minute job budget and all test/action budgets.
        # This bounded step leaves time for teardown and upload; a forced runner
        # stop can still prevent collection and is never complete qualification.
        timeout-minutes: 12
        run: |
          PARITY_OUTPUT="$E2E_CI_ROOT/public" npm run test:testerarmy
          PARITY_OUTPUT="$E2E_CI_ROOT/historical" node e2e/testerarmy/run-historical.mjs run
      - name: Prepare complete bounded public evidence
        id: bundle
        if: ${{ always() }}
        run: |
          node e2e/testerarmy/bundle.mjs create "$E2E_CI_ROOT/bundle" "$E2E_CI_ROOT/public" "$E2E_CI_ROOT/historical"
      - name: Retain evidence index including incomplete campaigns
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.E2E_CI_ROOT }}/bundle/manifest.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Retain public evidence part 1
        if: ${{ always() && steps.bundle.outputs.parts >= 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-part-1
          path: ${{ env.E2E_CI_ROOT }}/bundle/part-1/
          archive: true
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain public evidence part 2
        if: ${{ always() && steps.bundle.outputs.parts >= 2 }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-part-2
          path: ${{ env.E2E_CI_ROOT }}/bundle/part-2/
          archive: true
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain public evidence part 3
        if: ${{ always() && steps.bundle.outputs.parts >= 3 }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-part-3
          path: ${{ env.E2E_CI_ROOT }}/bundle/part-3/
          archive: true
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain public evidence part 4
        if: ${{ always() && steps.bundle.outputs.parts >= 4 }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-part-4
          path: ${{ env.E2E_CI_ROOT }}/bundle/part-4/
          archive: true
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-ci:
    name: test-ci
    if: ${{ always() }}
    needs: [lint, contracts, unit_tests, worker_contracts, testerarmy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
          WORKER_RESULT: ${{ needs.worker_contracts.result }}
          TESTERARMY_RESULT: ${{ needs.testerarmy.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$CONTRACTS_RESULT" != "success" || "$UNIT_TESTS_RESULT" != "success" || "$WORKER_RESULT" != "success" || "$TESTERARMY_RESULT" != "success" ]]; then
            echo "CI failed: lint=$LINT_RESULT contracts=$CONTRACTS_RESULT unit-tests=$UNIT_TESTS_RESULT worker=$WORKER_RESULT testerarmy=$TESTERARMY_RESULT"
            exit 1
          fi
