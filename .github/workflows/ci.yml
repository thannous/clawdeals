name: CI

# Manual only. Every push is checked locally first: `npm ci` installs a
# pre-push hook that runs `npm run test:ci`, and the PR states the command, SHA
# and result (AGENTS.md). Dispatch this workflow for a clean-machine run, for
# instance for the lint, Worker bundle or public browser journeys it adds:
# `gh workflow run ci.yml --ref <branch>`. All checks share one job so a run
# repeats checkout, setup and `npm ci` only once.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ci:
    # Keeps the `test-ci` status name of the former aggregate job.
    name: test-ci
    runs-on: ubuntu-latest
    # About 4 minutes observed; the margin covers a slow registry during
    # `npm ci` and lets evidence upload after a browser step timeout.
    timeout-minutes: 15
    env:
      E2E_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TESTERARMY_AI: "0"
      E2E_CI_ROOT: .e2e/ci/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Restore ESLint cache
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: ${{ runner.os }}-node-24-eslint-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node-24-eslint-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-
      - name: Install dependencies
        id: install
        run: npm ci --prefer-offline --no-audit --no-fund

      # Fast checks: each one runs after a successful install even when an
      # earlier check failed, so a single run reports every failure.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --cache --cache-location .eslintcache --cache-strategy content
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Validate i18n page contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:i18n:contract
      - name: Validate i18n messages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:i18n:messages
      - name: Lint OpenAPI contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run openapi:lint
      - name: Validate skill pack
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:skill:pack
      - name: Validate public skill files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:skill:public
      - name: Unit tests, including edge and remote MCP Worker contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: npm run test:unit
      - name: Bundle Cloudflare Worker without deploying
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm exec -- wrangler deploy --dry-run --outdir "$RUNNER_TEMP/clawdeals-worker-bundle"

      # Browser journeys are the most expensive part: they start only when
      # every check above passed.
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Check evidence preservation and bounded archive controls
        run: node --test e2e/testerarmy/evidence.test.mjs
      - name: Run public journeys with time for evidence
        id: public_journeys
        # About 1 minute observed. This bounded step leaves time for teardown
        # and upload within the job budget; a forced runner stop can still
        # prevent collection and is never complete qualification.
        timeout-minutes: 5
        run: |
          PARITY_OUTPUT="$E2E_CI_ROOT/public" npm run test:testerarmy
      - name: Prepare complete bounded public evidence
        id: bundle
        if: ${{ always() && steps.public_journeys.outcome != 'skipped' }}
        run: |
          node e2e/testerarmy/bundle.mjs create "$E2E_CI_ROOT/bundle" "$E2E_CI_ROOT/public"
      - name: Retain evidence index including incomplete campaigns
        if: ${{ always() && steps.public_journeys.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.E2E_CI_ROOT }}/bundle/manifest.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Retain public evidence part 1
        if: ${{ always() && steps.bundle.outputs.parts >= 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-part-1
          path: ${{ env.E2E_CI_ROOT }}/bundle/part-1/
          archive: true
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain public evidence part 2
        if: ${{ always() && steps.bundle.outputs.parts >= 2 }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-part-2
          path: ${{ env.E2E_CI_ROOT }}/bundle/part-2/
          archive: true
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain public evidence part 3
        if: ${{ always() && steps.bundle.outputs.parts >= 3 }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-part-3
          path: ${{ env.E2E_CI_ROOT }}/bundle/part-3/
          archive: true
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain public evidence part 4
        if: ${{ always() && steps.bundle.outputs.parts >= 4 }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-part-4
          path: ${{ env.E2E_CI_ROOT }}/bundle/part-4/
          archive: true
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
