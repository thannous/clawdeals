name: CI

# Manual dispatch only (`gh workflow run ci.yml --ref <branch>`): a
# clean-machine run on request, never a merge or release gate. PRs are checked
# locally with `npm run verify:pr`, and the PR states the verified commit and
# the result. All checks share one job so a run repeats checkout, setup and
# `npm ci` only once.
on:
  workflow_dispatch:

permissions:
  contents: read

# One run per PR or ref. A newer run cancels an older one everywhere but main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-ci:
    # Keeps the `test-ci` status name of the former aggregate job.
    name: test-ci
    runs-on: ubuntu-latest
    # The maintained browser selection now includes 266 desktop/mobile cases.
    # Leave time for a complete run and for evidence after a step timeout.
    timeout-minutes: 25
    env:
      E2E_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TESTERARMY_AI: "0"
      E2E_CI_ROOT: .e2e/ci/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Restore ESLint cache
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: ${{ runner.os }}-node-24-eslint-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node-24-eslint-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-
      - name: Install dependencies
        id: install
        run: npm ci --prefer-offline --no-audit --no-fund

      # Fast checks: each one runs after a successful install even when an
      # earlier check failed, so a single run reports every failure.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --cache --cache-location .eslintcache --cache-strategy content
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Validate i18n page contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:i18n:contract
      - name: Validate i18n messages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:i18n:messages
      - name: Lint OpenAPI contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run openapi:lint
      - name: Validate skill pack
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:skill:pack
      - name: Validate public skill files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:skill:public
      - name: Unit tests, including edge and remote MCP Worker contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: npm run test:unit
      - name: Bundle Cloudflare Worker without deploying
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm exec -- wrangler deploy --dry-run --outdir "$RUNNER_TEMP/clawdeals-worker-bundle"

      # Browser journeys are the most expensive part: they start only when
      # every check above passed.
      # Chromium only, cached per Playwright version; a cache hit still installs
      # the system libraries, which live outside the cache.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install chromium --with-deps
      - name: Install Chromium system dependencies
        if: ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium
      - name: Check evidence preservation and bounded archive controls
        run: node --test e2e/testerarmy/evidence.test.mjs
      - name: Run public desktop journeys
        id: public_journeys
        # A fresh Next.js process per viewport avoids a memory-threshold restart
        # interrupting a later navigation. Keep every assertion and zero retries.
        timeout-minutes: 10
        env:
          # Public client fixtures only: auth calls are intercepted by the tests.
          # No service key, live provider, database or credential is configured.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: testerarmy-public-anon-placeholder
        run: |
          PARITY_OUTPUT="$E2E_CI_ROOT/public-desktop" npm run test:testerarmy -- --target desktop
      - name: Run public mobile journeys
        id: public_mobile
        if: ${{ !cancelled() && steps.public_journeys.outcome != 'skipped' }}
        timeout-minutes: 10
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: testerarmy-public-anon-placeholder
        run: |
          PARITY_OUTPUT="$E2E_CI_ROOT/public-mobile" npm run test:testerarmy -- --target mobile
      - name: Prepare complete bounded public evidence
        id: bundle
        if: ${{ always() && steps.public_journeys.outcome != 'skipped' }}
        run: |
          node e2e/testerarmy/bundle.mjs create "$E2E_CI_ROOT/bundle" "$E2E_CI_ROOT/public-desktop" "$E2E_CI_ROOT/public-mobile"
      - name: Retain evidence index including incomplete campaigns
        if: ${{ always() && steps.public_journeys.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.E2E_CI_ROOT }}/bundle/manifest.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Retain public evidence part 1
        if: ${{ always() && steps.bundle.outputs.parts >= 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-part-1
          path: ${{ env.E2E_CI_ROOT }}/bundle/part-1/
          archive: true
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain public evidence part 2
        if: ${{ always() && steps.bundle.outputs.parts >= 2 }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-part-2
          path: ${{ env.E2E_CI_ROOT }}/bundle/part-2/
          archive: true
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain public evidence part 3
        if: ${{ always() && steps.bundle.outputs.parts >= 3 }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-part-3
          path: ${{ env.E2E_CI_ROOT }}/bundle/part-3/
          archive: true
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain public evidence part 4
        if: ${{ always() && steps.bundle.outputs.parts >= 4 }}
        uses: actions/upload-artifact@v7
        with:
          name: testerarmy-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-part-4
          path: ${{ env.E2E_CI_ROOT }}/bundle/part-4/
          archive: true
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
