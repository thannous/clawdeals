name: SDK Release

on:
  push:
    tags:
      - "sdk-ts-v*"
      - "sdk-py-v*"

jobs:
  release_ts:
    if: startsWith(github.ref_name, 'sdk-ts-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Generate TS SDK
        run: npm run sdk:generate:ts
      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#sdk-ts-v}"
          PKG="$(node -p \"require('./sdk/typescript/package.json').version\")"
          echo "tag=$TAG pkg=$PKG"
          test "$TAG" = "$PKG"
      - name: Install SDK deps
        run: npm --prefix sdk/typescript ci
      - name: Build
        run: npm --prefix sdk/typescript run build
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm --prefix sdk/typescript publish --access public

  release_py:
    if: startsWith(github.ref_name, 'sdk-py-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install root deps
        run: npm ci
      - name: Generate Python SDK
        run: npm run sdk:generate:py
      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#sdk-py-v}"
          PY="$(python -c 'import tomllib; print(tomllib.load(open(\"sdk/python/pyproject.toml\",\"rb\"))[\"project\"][\"version\"])')"
          echo "tag=$TAG py=$PY"
          test "$TAG" = "$PY"
      - name: Install build deps
        run: |
          python -m pip install -U pip
          python -m pip install build
          python -m pip install "sdk/python[dev]"
      - name: Test
        run: pytest -q sdk/python/tests
      - name: Build
        run: python -m build sdk/python
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
