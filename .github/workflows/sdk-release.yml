name: SDK Release

# Publishes the TypeScript SDK to npm or the Python SDK to PyPI. Manual
# dispatch only, on an explicit decision to publish:
# `gh workflow run sdk-release.yml --ref main -f target=ts -f version=X.Y.Z`.
# The version input must equal the SDK's own version. PyPI trusted publishing
# needs this GitHub Actions run (registry constraint, External CI table).
on:
  workflow_dispatch:
    inputs:
      target:
        description: "SDK to publish"
        required: true
        type: choice
        options:
          - ts
          - py
      version:
        description: "Version to publish (X.Y.Z, must equal the SDK version)"
        required: true
        type: string

jobs:
  release_ts:
    if: inputs.target == 'ts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Generate TS SDK
        run: npm run sdk:generate:ts
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Verify version matches input
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="$INPUT_VERSION"
          PKG="$(node -p "require('./sdk/typescript/package.json').version")"
          echo "input=$TAG pkg=$PKG"
          test -n "$TAG"
          test "$TAG" = "$PKG"
      - name: Install SDK deps
        run: npm --prefix sdk/typescript ci
      - name: Build
        run: npm --prefix sdk/typescript run build
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm --prefix sdk/typescript publish --access public

  release_py:
    if: inputs.target == 'py'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install root deps
        run: npm ci
      - name: Generate Python SDK
        run: npm run sdk:generate:py
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Verify version matches input
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="$INPUT_VERSION"
          PY="$(python -c 'import tomllib; print(tomllib.load(open("sdk/python/pyproject.toml","rb"))["project"]["version"])')"
          echo "input=$TAG py=$PY"
          test -n "$TAG"
          test "$TAG" = "$PY"
      - name: Install build deps
        run: |
          python -m pip install -U pip
          python -m pip install build
          python -m pip install "sdk/python[dev]"
      - name: Test
        run: pytest -q sdk/python/tests
      - name: Build
        run: python -m build sdk/python
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
