name: SDK CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run sdk:generate:ts
      - run: npm --prefix sdk/typescript ci
      - run: npm --prefix sdk/typescript run typecheck
      - run: npm run test:unit

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci
      - run: npm run sdk:generate:py
      - run: python -m pip install -U pip
      - run: python -m pip install "sdk/python[dev]"
      - run: pytest -q sdk/python/tests
